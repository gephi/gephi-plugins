name: release

on:
  push:
    branches: [ master-forge ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Maven Central Repository
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Get NBM Keystore
        run: |
          echo "${{ secrets.NBM_KEYSTORE }}" > keystore.ks.asc
          gpg -d --passphrase "${{ secrets.NBM_KEYSTORE_ENC_PASSPHRASE }}" --batch keystore.ks.asc > keystore.ks

      - name: Build and publish package Linux
        run: mvn --batch-mode -Djava.awt.headless=true -Dkeystore.password=${{ secrets.KEYSTORE_PASSWD }} package -P release
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Configure Git user
        run: |
          git config --global user.email "github-action@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      - name: Update autoupdate content on gh-pages
        run: mvn scm-publish:publish-scm -P release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # gephi.github.io is a static build that reads plugins.json at build time, so it needs an
      # explicit rebuild whenever this workflow updates gh-pages.
      - name: Get website deploy token
        uses: actions/create-github-app-token@v2
        id: website-app-token
        with:
          app-id: ${{ secrets.GEPHI_WEBSITE_DEPLOY_APP_ID }}
          private-key: ${{ secrets.GEPHI_WEBSITE_DEPLOY_APP_PRIVATE_KEY }}
          owner: gephi
          repositories: gephi.github.io

      - name: Trigger gephi.github.io rebuild
        env:
          GH_TOKEN: ${{ steps.website-app-token.outputs.token }}
        run: gh workflow run deploy.yml --repo gephi/gephi.github.io --ref main