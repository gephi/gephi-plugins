name: test-generation

# Integration test for the plugin generation process (gephi-maven-plugin's
# generate/validate/build-metadata/create-autoupdate goals). Runs on every
# master commit so a version bump of gephi-maven-plugin in pom.xml is
# regression-tested before real plugin repos pick it up.
on:
  push:
    branches: [ master ]

jobs:
  generation-integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate a throwaway fixture plugin
        run: |
          set -e
          timeout 120 mvn -B org.gephi:gephi-maven-plugin:generate <<'EOF'
          org.gephi.citest
          ci-integration-test-plugin
          1.0.0
          CiIntegrationTestPlugin
          CI Integration Test Plugin
          Tool
          CI Bot

          https://github.com/gephi/gephi-plugins
          Apache 2.0
          CI test plugin for gephi-maven-plugin generation.
          Generated by CI to validate the gephi-maven-plugin generation process end to end.
          no
          EOF

      - name: Sanity-check the generated fixture
        run: |
          set -e
          test -f modules/CiIntegrationTestPlugin/pom.xml
          grep -q '<module>modules/CiIntegrationTestPlugin</module>' pom.xml

      - name: Build, validate and generate the autoupdate site
        run: mvn -B package -P release --file pom.xml

      - name: Assert the generation process produced a working autoupdate site
        run: |
          set -e
          GEPHI_MINOR=$(sed -nE 's/.*<gephi\.version>([0-9]+\.[0-9]+)\.[0-9]+<\/gephi\.version>.*/\1/p' pom.xml | head -1)
          UPDATES_XML="target/site/plugins/${GEPHI_MINOR}/updates.xml"
          NBM_FILE="target/site/plugins/${GEPHI_MINOR}/ci-integration-test-plugin-1.0.0.nbm"

          test -f "$UPDATES_XML"
          test -f "$NBM_FILE"
          grep -q 'codenamebase="org.gephi.citest.ci.integration.test.plugin"' "$UPDATES_XML"
