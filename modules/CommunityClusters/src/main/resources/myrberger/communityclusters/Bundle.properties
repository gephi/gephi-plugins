# Shown in Gephi's plugin manager and on the plugin's page (pointed to by OpenIDE-Module-Localizing-Bundle in manifest.mf)
OpenIDE-Module-Long-Description=Arranges a network so that each community forms its own visible cluster. Any field that \
    is categorical, numerical or alphanumerical, can be used as the Cluster column (for \
    example modularity_class from Statistics > Modularity). Or choose none and the plugin \
    detects communities itself with the Leiden algorithm. Clusters are packed apart from \
    each other and the nodes inside a cluster are placed by their ties. Settings control \
    cluster separation, repulsion, tie length, node spacing and more. By Johan Myrberger, \
    https://www.linkedin.com/in/myrberger/

# Layout and builder
CommunityClustersBuilder.name=Community Clusters
CommunityClustersBuilder.description=Force layout that gathers each community into its own cluster. Uses any categorical node column as the community, or detects communities with Leiden.

# Property categories
CommunityClusters.category.clusters=Clusters
CommunityClusters.category.forces=Forces
CommunityClusters.category.run=Run

# Clusters
CommunityClusters.clusterColumn.name=Cluster column
CommunityClusters.clusterColumn.desc=Node column that says which community each node belongs to. The list shows columns holding whole numbers, text or true/false values (for example modularity_class from Statistics > Modularity). Choose "(none: detect communities with Leiden)" to let the plugin find the communities itself.
CommunityClusters.clusterColumn.none=(none: detect communities with Leiden)
CommunityClusters.resolution.name=Resolution
CommunityClusters.resolution.desc=Leiden only: higher gives more and smaller clusters, lower gives fewer and larger ones.
CommunityClusters.saveClusters.name=Save clusters to column
CommunityClusters.saveClusters.desc=Leiden only: write the detected clusters to the node column "community_cluster" so you can colour or partition by it.
CommunityClusters.clusterPull.name=Cluster pull
CommunityClusters.clusterPull.desc=How strongly each node is pulled towards its cluster's place. Higher gives tight, separated blobs; lower lets ties between clusters pull them together. (0 - 0.6)
CommunityClusters.interClusterTieFactor.name=Inter-cluster tie factor
CommunityClusters.interClusterTieFactor.desc=Strength of ties between clusters relative to ties inside a cluster.

# Forces
CommunityClusters.repulsion.name=Repulsion
CommunityClusters.repulsion.desc=How hard nodes push each other apart (many-body strength).
CommunityClusters.tieLength.name=Tie length
CommunityClusters.tieLength.desc=Resting tie length, added to the two node sizes.
CommunityClusters.tieStrength.name=Tie strength
CommunityClusters.tieStrength.desc=Multiplies how hard ties pull their ends together.
CommunityClusters.nodeSpacing.name=Node spacing
CommunityClusters.nodeSpacing.desc=Extra room kept around each node by the collision force.
CommunityClusters.scale.name=Scale
CommunityClusters.scale.desc=Multiplies all distances. Raise it for graphs with large node sizes.

# Run
CommunityClusters.settlingSpeed.name=Settling speed
CommunityClusters.settlingSpeed.desc=Cooling rate. Lower searches longer and usually untangles more. (0.005 - 0.1)
CommunityClusters.randomSeed.name=Random seed
CommunityClusters.randomSeed.desc=Seed for the starting positions and for Leiden.
CommunityClusters.resetPositions.name=Reset positions
CommunityClusters.resetPositions.desc=Start from fresh positions around each cluster's place instead of the current ones.
