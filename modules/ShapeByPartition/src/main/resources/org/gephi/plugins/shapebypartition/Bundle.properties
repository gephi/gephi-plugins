OpenIDE-Module-Display-Category=Preview
OpenIDE-Module-Name=Shape by Partition
OpenIDE-Module-Short-Description=Assign node shape automatically from a categorical attribute, the shape equivalent of color by partition.
OpenIDE-Module-Long-Description=\
Renders each node as one of eight shapes (circle, square, triangle, diamond, star, cross, downward triangle, and hexagon) chosen by its value in a categorical node column. Every shape matches the area of the circle it replaces, so node size reads the same across categories, and corners are softened so small marks stay clean.\
<p>Categories are ordered by node count, largest first, which is the same order the Appearance panel uses when it assigns colors to a partition. Coloring and shaping by the same column therefore agree.</p>\
<p>Nodes with no value in the column are drawn as circles, and color, size, border, and opacity are left to the default renderer.</p>\
<p>Shape is worth spending when colour and position cannot carry the variable: on an attribute that cuts across the clusters rather than naming them, and that does not already track node size. It is also the encoding that survives greyscale printing and colourblind readers, where a colour palette collapses.</p>\
<p>A legend beside the graph says which shape stands for which category, in the preview and in exports. Name the column the node colours encode in "Colour legend column" and the legend explains colour as well, when that column matches the colours exactly.</p>\
<p>Shapes appear in Preview and its PNG, SVG and PDF exports. The Overview window keeps drawing circles, because it is drawn by a separate engine this plugin does not extend.</p>\
<p>If you also use Polygon Shaped Nodes or another plugin that draws nodes or arrows, choose which one draws them in Preview > Manage Renderers.</p>\
<p>Edges and arrowheads meet each shape's outline, not the circle Gephi assumes, so arrows stay visible and point at the shape.</p>\
<p>The renderer replaces the built-in node renderer on install, so there is nothing to enable. Set "Shape partition column" in the Preview settings under Nodes, then refresh. Leaving it empty reads a column named shape_partition instead, so a dataset that carries that column is shaped on import with nothing to configure.</p>

ShapeByPartitionRenderer.name=Shape by Partition
ShapeByPartitionRenderer.enabled.name=Shape by partition
ShapeByPartitionRenderer.enabled.description=Draw each node as a shape chosen by its value in the partition column. When this is off, or the column is empty, nodes are drawn as circles.
ShapeByPartitionRenderer.column.name=Shape partition column
ShapeByPartitionRenderer.column.description=Name of the node column holding the categories, matched against column ids first and column titles second. Leave it empty to read a column named shape_partition, so a file that ships that column needs no setting up. Categories are ordered by node count, largest first, and take the shapes circle, square, triangle, diamond, star, cross, downward triangle, and hexagon in that order. Nodes with no value are drawn as circles. Shape separates about five categories reliably; past eight the shapes repeat.
ShapeAwareArrowRenderer.name=Arrows (Shape by Partition)
ShapeLegendRenderer.name=Shape legend (Shape by Partition)
ShapeLegendRenderer.show.name=Shape legend
ShapeLegendRenderer.show.description=Draw a key beside the graph showing which shape stands for which category, in the preview and in exports. Symbols take the categories' colours when colour encodes the same column, and are grey otherwise.
ShapeLegendRenderer.title.name=Shape legend title
ShapeLegendRenderer.title.description=Heading for the shape legend. Leave it empty to use the title of the column the shapes are read from.
ShapeLegendRenderer.colourColumn.name=Colour legend column
ShapeLegendRenderer.colourColumn.description=Name of the node column the node colours encode, to add its colours to the legend below the shapes. Leave it empty for no colour key: Gephi does not record which column the colours came from, so it is never guessed. The key is drawn only when the column explains the colours exactly, every group in one colour and no colour shared by two groups; otherwise it stays off and the reason is logged.
ShapeLegendRenderer.colourTitle.name=Colour legend title
ShapeLegendRenderer.colourTitle.description=Heading for the colour section of the legend. Leave it empty to use the title of the colour legend column.
# Drawn on the figure itself, in the preview and every export.
ShapeLegend.noValue=no value
