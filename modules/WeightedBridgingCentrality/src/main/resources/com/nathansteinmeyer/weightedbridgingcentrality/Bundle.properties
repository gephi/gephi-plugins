OpenIDE-Module-Name=Weighted Bridging Centrality
OpenIDE-Module-Short-Description=Calculates weighted betweenness and bridging centrality using edge strength as inverse distance.
OpenIDE-Module-Long-Description=Calculates weighted betweenness centrality and weighted bridging centrality for networks in which edge weights represent connection strength. Edge strength is converted to effective distance using d = 1/w, so stronger connections correspond to shorter paths. Weighted betweenness centrality is calculated using weighted shortest paths, while weighted bridging centrality combines this measure with the standard bridging coefficient. This plugin is based on and extends the Bridging Centrality Plugin from the santosardr/gephi-plugins repository, adding support for weighted shortest-path calculations.
OpenIDE-Module-Display-Category=Metric

WeightedBridgingCentralityMetricBuilder.name=Weighted Bridging Centrality Algorithm

WeightedBridgingCentralityMetricUI.displayName=Weighted Bridging Centrality
WeightedBridgingCentralityMetricUI.shortDescription=Weighted Bridging Centrality identifies nodes that connect otherwise separate regions of a network. Edge weights are interpreted as connection strengths and converted to effective distances using d = 1/w. Weighted Betweenness Centrality is calculated from these weighted shortest paths and multiplied by the standard Bridging Coefficient to produce Weighted Bridging Centrality. This plugin appends Weighted Betweenness Centrality, Bridging Coefficient, and Weighted Bridging Centrality to the Gephi Data Laboratory.

